      <div class="fx-shell">
        <div class="fx-loading-card">
          <div class="fx-brand">
            <img src="/logo.svg" alt="Nbility AI" />
            <div>
              <h1 class="fx-brand-title">Nbility AI</h1>
              <p class="fx-brand-subtitle" id="fx-brand-subtitle">
                稳定接入 Claude、Codex、GPT、Gemini 等常用模型
              </p>
            </div>
          </div>
          <p class="fx-loading-headline" id="fx-loading-headline">
            正在加载控制台与套餐信息
          </p>
          <p class="fx-loading-copy" id="fx-loading-copy">
            页面初始化时会同步站点配置、登录状态与可售套餐。若停留时间过长，请检查网络或稍后刷新重试。
          </p>
          <div class="fx-loading-bar" aria-hidden="true"></div>
          <div class="fx-loading-tips" aria-hidden="true">
            <div class="fx-tip" id="fx-tip-1">官方通道优先</div>
            <div class="fx-tip" id="fx-tip-2">企业采购支持</div>
            <div class="fx-tip" id="fx-tip-3">订阅与代发放整合</div>
          </div>
          <noscript>
            <div class="fx-noscript" id="fx-noscript">
              This page requires JavaScript. Please enable scripts in your
              browser, or visit the
              <a href="https://nbility.dev/pricing?currency=CNY"
                >pricing page</a
              >
              to view available plans.
            </div>
          </noscript>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var copy = window.__FX_INDEX_COPY__;
        if (!copy) {
          return;
        }

        var subtitle = document.getElementById('fx-brand-subtitle');
        var headline = document.getElementById('fx-loading-headline');
        var loadingCopy = document.getElementById('fx-loading-copy');
        var tip1 = document.getElementById('fx-tip-1');
        var tip2 = document.getElementById('fx-tip-2');
        var tip3 = document.getElementById('fx-tip-3');

        if (subtitle) subtitle.textContent = copy.subtitle;
        if (headline) headline.textContent = copy.headline;
        if (loadingCopy) loadingCopy.textContent = copy.copy;
        if (tip1) tip1.textContent = copy.tip1;
        if (tip2) tip2.textContent = copy.tip2;
        if (tip3) tip3.textContent = copy.tip3;
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
